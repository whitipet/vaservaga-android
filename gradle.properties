#region Gradle
gradle = build -x lint
org.gradle.jvmargs = -Xms3g -Xmx5g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -XX:+UseCompressedOops -XX:SoftRefLRUPolicyMSPerMB=1 -XX:ReservedCodeCacheSize=256m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs = -Xms3g -Xmx5g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -XX:+UseCompressedOops -XX:SoftRefLRUPolicyMSPerMB=1 -XX:ReservedCodeCacheSize=320m -Dfile.encoding=UTF-8
org.gradle.daemon = true
org.gradle.parallel = true
org.gradle.configureondemand = true
org.gradle.vfs.watch = true
org.gradle.caching = true
org.gradle.configuration-cache = true
org.gradle.configuration-cache.parallel = true
org.gradle.configuration-cache.problems = warn
# Default is summary. https://docs.gradle.org/8.2/userguide/command_line_interface.html#sec:command_line_warnings
org.gradle.warning.mode = none
#endregion Gradle

#region General
android.enableBuildConfigAsBytecode = true
android.enableBuildScriptClasspathCheck = false
android.useMinimalKeepRules = true
android.enableR8.fullMode = true
android.enableResourceOptimizations = true
android.nonTransitiveRClass = true
android.nonFinalResIds = true
#endregion General

#region Build features
# https://developer.android.com/reference/tools/gradle-api/com/android/build/api/dsl/BuildFeatures

android.defaults.buildfeatures.compose = false
android.defaults.buildfeatures.prefab = false
android.defaults.buildfeatures.renderScript = false
android.defaults.buildfeatures.viewBinding = false
android.defaults.buildfeatures.dataBinding = false
#endregion Build features