#region Gradle
gradle = build -x lint
org.gradle.jvmargs = -Xms3g -Xmx5g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -XX:+UseCompressedOops -XX:SoftRefLRUPolicyMSPerMB=1 -XX:ReservedCodeCacheSize=256m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs = -Xms3g -Xmx5g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -XX:+UseCompressedOops -XX:SoftRefLRUPolicyMSPerMB=1 -XX:ReservedCodeCacheSize=320m -Dfile.encoding=UTF-8
org.gradle.daemon = true
org.gradle.parallel = true
org.gradle.tooling.parallel = true
org.gradle.configureondemand = true
org.gradle.vfs.watch = true
org.gradle.caching = true
org.gradle.configuration-cache = true
org.gradle.configuration-cache.parallel = true
org.gradle.warning.mode = summary
#endregion Gradle

#region General
# Option defaults and lifecycle stages:
# https://cs.android.com/android-studio/platform/tools/base/+/mirror-goog-studio-main:build-system/gradle-core/src/main/java/com/android/build/gradle/options/BooleanOption.kt

# ENABLE_BUILD_CONFIG_AS_BYTECODE, default false
android.enableBuildConfigAsBytecode = true

# FULL_R8, default true, softly enforced. The flag will be removed in AGP 10.
android.enableR8.fullMode = true

# MINIMAL_KEEP_RULES, default true
android.useMinimalKeepRules = true

# ENABLE_RESOURCE_OPTIMIZATIONS, default true
android.enableResourceOptimizations = true

# USE_NON_FINAL_RES_IDS, default true, deprecated. The flag will be removed in AGP 10.
android.nonFinalResIds = true

# NON_TRANSITIVE_R_CLASS, default true
android.nonTransitiveRClass = true

# ONLY_ENABLE_UNIT_TEST_BY_DEFAULT_FOR_THE_TESTED_BUILD_TYPE, default true
android.onlyEnableUnitTestForTheTestedBuildType = true
#endregion General