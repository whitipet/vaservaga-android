apply plugin: "com.android.application"
apply from: file("$rootDir/projectConfig.gradle")

android {
	enableKotlin = false

	namespace = config.applicationId

	compileSdk { version = release(config.compileSdkVersion) { minorApiLevel = config.compileSdkVersionMinor } }
	buildToolsVersion = config.buildToolsVersion

	androidResources {
		localeFilters = ["en"]
		generateLocaleConfig = false
	}

	buildFeatures {
		buildConfig = false
		resValues = false
		shaders = false
	}

	defaultConfig {
		applicationId = config.applicationId

		minSdk { version = release(config.minSdkVersion) }
		targetSdk { version = release(config.compileSdkVersion) }

		addManifestPlaceholders(appName: config.appName)

		versionCode = config.versionCode
		versionName = config.versionName
	}

	compileOptions.incremental = true

	lint {
		abortOnError = false
		checkReleaseBuilds = false
	}

	packaging {
		jniLibs.useLegacyPackaging = false
		resources.excludes.addAll([
				"/META-INF/**/LICENSE.txt",
				"/META-INF/**/NOTICE.txt",
				"/META-INF/native-image/**",
				"/DebugProbesKt.bin",
		])
	}

	dependenciesInfo {
		includeInApk = false
		includeInBundle = false
	}

	buildTypes {
		debug {
			debuggable = true
			crunchPngs = false
			optimization.enable = false
		}

		release {
			debuggable = false
			crunchPngs = true
			optimization.enable = true
		}
	}
}

java.toolchain {
	languageVersion = config.javaVersion
	vendor = JvmVendorSpec.ADOPTIUM
}